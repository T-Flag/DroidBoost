name: versions
on:
  push:
    paths:
      - .github/workflows/versions.yml
jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - name: SDK installé sur le runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" || true
          java -version 2>&1 | head -1
      - name: Dernières versions publiées
        run: |
          latest() {
            curl -fsSL "$1/$2/maven-metadata.xml" | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' \
              | grep -viE 'alpha|beta|rc|dev|-m[0-9]|eap|snapshot' | tail -3 | tr '\n' ' '
            echo
          }
          G=https://dl.google.com/dl/android/maven2
          C=https://repo1.maven.org/maven2
          P=https://plugins.gradle.org/m2
          for a in com/android/tools/build/gradle androidx/compose/compose-bom androidx/room/room-runtime \
                   androidx/work/work-runtime androidx/glance/glance-appwidget androidx/navigation/navigation-compose \
                   androidx/activity/activity-compose androidx/lifecycle/lifecycle-runtime-compose \
                   androidx/datastore/datastore-preferences androidx/core/core-ktx androidx/sqlite/sqlite-bundled; do
            printf '%s: ' "$a"; latest $G $a
          done
          for a in dev/rikka/shizuku/api dev/rikka/shizuku/provider org/jetbrains/kotlinx/kotlinx-coroutines-core \
                   org/jetbrains/kotlinx/kotlinx-serialization-json com/patrykandpatrick/vico/compose-m3 \
                   org/lsposed/hiddenapibypass/hiddenapibypass junit/junit; do
            printf '%s: ' "$a"; latest $C $a
          done
          for a in com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin \
                   org/jetbrains/kotlin/plugin/compose/org.jetbrains.kotlin.plugin.compose.gradle.plugin; do
            printf '%s: ' "$a"; latest $P $a
          done
          printf 'gradle: '; curl -fsSL https://services.gradle.org/versions/current | grep -o '"version" : "[^"]*"'
